<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 1px solid black;
            width: 90%; 
            margin: auto;
            padding: 10px;

        }
        header {
            text-align: center;
            background-color: lightskyblue;
            margin-bottom: 10px;
            padding: 20px;

        
        }
        main {
            border: 1px solid black;
            width: 100%;
            margin: auto;
            padding: 3px;
            height: 300px;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: gray;
            margin-bottom: 0px;
            width: 90%;
        }
        footer {
            display: flex;
            background-color: grey;
            justify-content: center;

        }
        button:hover {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
        <h2>Welcome to my page</h2>
        <p>This is a simple example with divs and css</p>
        </header>
        <main>
            <h2>About</h2>
            <p>This section is inside the content div. You can add text,images or anything else here.</p>
            <button style="background-color: green;">Click me</button>
        </main>
        <br>
        <footer>&copy; 2026 my simple website</footer>
    </div>
    
</body>
</html>
