<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .Container {
        border: none;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0;
        width: 80%;
        justify-content: center;
        }
        .card {
          border: none;
          background-color: whitesmoke;
          border-radius: 15px;
          min-height: 200px;
          box-sizing: border-box;
          padding-bottom: 20px;
          text-align: center;
          border-style: none;
        }
        img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-top: 10px;
        align-items: center;
        }

      button {
         color: white;
         background-color: green;
         height: 30px;
         border: 1px solid;
         width: 100px;
      }
    </style>
</head>
<body>
    <div class="Container">
        <div class="card">
            <img src="IMG_1386.PNG" alt="profile picture">
