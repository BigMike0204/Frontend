<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            width: 500px;
            height: 300px;
            border-radius: 15px;
            background-color: blue;
            gap: 20px;
            justify-content: flex-start;
            flex-wrap: wrap-reverse;

        }
        div {
            background-color: green;
            display: flex;
            color: white;
            width: 100px;
            height: 80px;
            border-radius: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>apple</div>
        <div>banana</div>
        <div>mango</div>
        <div>gauva</div>
        <div>orange</div>
        <div>lemon</div>
        <div>pineapple</div>
        <div>citrus</div>
    </div>

</body>
</html>
