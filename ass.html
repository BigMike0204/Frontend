<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

        div{

            height: 100px;

        }

            width: 82%;
            border-collapse: collapse;
        }
        th{

        }
        th{
            border: 1px solid white;
            text-align: center;
        }

       <th>#</th>
