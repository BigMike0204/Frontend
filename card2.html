<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Card {
            border-radius: 15px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 300px;
            align-items: center;
            min-height: 300px;
        }
        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-top: 10px;
        }
        p {
            text-align: center;
        }
        button {
            padding: 5px;
            border-radius: 0px;
            cursor: pointer;
            background-color: blue;
            color: white;
        }
        button.hover {
            background-color: royalblue;
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="Card">
        <img src="IMG_1386.PNG" alt="profile picture">
        <h2>John doe</h2>
        <p>Webdeveloper who loves html. i am anticipating to be one of them.</p>
        <button>submit</button>




    </div>
    
</body>
</html>
