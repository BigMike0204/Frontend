<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: darkcyan;
            border: 1px solid white;
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;

        }
        div {
            border-radius: 10px;
            background-color: white;
            height: 600px;
            width: 450px;
            padding: 20px;
        }
        button {
         color: white;
         background-color: darkgreen;
         height: 40px;
         border: 1px solid;
         width: 93%;
         justify-content: center;
         padding: 15px;
         align-self: center;
         border-radius: 10px;
         text-align: left;
        }
        input {
            width: 90%;
            height: 40px;
            border-radius: 10px;
            border: 1px solid black;
    
            justify-content: center;
        }
        p{
            text-align: center;
        }
        h1{
            text-align: left;
            padding: 10px;
            margin: 0;
        }
        .box{
            text-align: left;
            padding: 10px;
            margin-top: 0;
        }  
    
        footer {
            display: flex;
        }
    </style>
</head>
<body>
   <div>
        <h1>Create Account</h1>
        <p class="box">Join account hub today</p>
        <form action="submit js"></form>
        <h2>Full Name</h2>
        <input type="Full Name" placeholder="Full Name"><br><br>
        <h2>Email</h2>
        <input type="Email" placeholder="Email">
        <h2>password</h2>
        <input type="password" placeholder="Password"><br><br>
        <button style="background-color: green;">Sign Up</button><br><br>
        <p class="text">Dont have an account?<span style="color: blue;">Log In</span></p>
        </div>
</body>
</html>
