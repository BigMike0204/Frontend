<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body{
            background-color: lightblue;
            border: 1px solid white;
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .contact-box{
            background-color: white box;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 12px;
        }
        h1{
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }
        p{
            text-align: center;
            color: muted gray;
            margin-bottom: 24px;
        }
        .email{
            color: blue;
            font-size: 22px;
            font-weight: bold;
        }
        input,textarea{
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea{
            resize: vertical;
            height: 120px;
        }
    </style>
    </head>
    <div class="Contact-box">
    <h2>Contact Us</h2>
    <p>We're here to help! Reach out anytime.</p>
    <p>
        <span class="email">Email:</span>
        support@loanapp.com
    </p>
    <form>
            <input type="text" placeholder="Your Name"><br>
            <input type="email" placeholder="Your Email"><br>
            <textarea name="ymessage" placeholder="Your message" rows="5" cols="30"></textarea><br>
        </form>
        </div>
</body>
</html>
