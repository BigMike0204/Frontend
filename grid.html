<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            background-color: orangered;
            height: 400px;
            width: 800px;
            grid-template-columns: repeat(4,1fr);
            gap: 30px;
        }
        .container div {
            background-color: blue;
            color: white;
           border: 1px solid black;
        }
        .item1 {
            grid-row-start: 1;
            grid-row-end: 3;
        }
        .item5 {
            grid-column-start: 1;
            grid-column-end: end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">orange</div>
        <div>apple</div>
        <div>mango</div>
        <div class="item4">gauva</div>
        <div class="item5">watermelon</div>
        <div>cashew</div>
        <div>cucumber</div>
        <div>pineapple</div>
        <div>banana</div>
        <div>cherry</div>


    </div>
</body>
</html>
